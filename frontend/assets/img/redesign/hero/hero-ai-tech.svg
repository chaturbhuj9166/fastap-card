<svg width="800" height="900" viewBox="0 0 800 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Gradients -->
    <linearGradient id="heroMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c7d2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>
    <radialGradient id="eyeGlow">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="bgGlow1">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="bgGlow2">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Glow Effects -->
  <ellipse cx="400" cy="350" rx="350" ry="300" fill="url(#bgGlow1)"/>
  <ellipse cx="500" cy="400" rx="250" ry="250" fill="url(#bgGlow2)"/>

  <!-- Tech Panels - Top Right Fan -->
  <g transform="translate(480, 50)">
    <!-- Panel 1 - Robotic Arm -->
    <g transform="rotate(-45 150 150)">
      <path d="M 0 0 L 180 0 L 200 20 L 200 160 L 20 160 L 0 140 Z" fill="url(#panelGrad)" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
      <g transform="translate(30, 30)">
        <circle cx="70" cy="70" r="50" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
        <path d="M 40 100 L 60 60 L 100 50 L 110 80" stroke="#06b6d4" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="40" cy="100" r="8" fill="#3b82f6"/>
        <circle cx="110" cy="80" r="6" fill="#06b6d4"/>
        <circle cx="60" cy="60" r="4" fill="#7c3aed"/>
        <circle cx="100" cy="50" r="4" fill="#7c3aed"/>
      </g>
    </g>

    <!-- Panel 2 - Gears/Cogs -->
    <g transform="rotate(-20 150 150)">
      <path d="M 30 -60 L 200 -60 L 220 -40 L 220 100 L 50 100 L 30 80 Z" fill="url(#panelGrad)" stroke="#7c3aed" stroke-width="1" opacity="0.6"/>
      <g transform="translate(80, -20)">
        <circle cx="50" cy="50" r="35" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 4"/>
        <circle cx="50" cy="50" r="20" fill="none" stroke="#a855f7" stroke-width="2"/>
        <circle cx="50" cy="50" r="8" fill="#7c3aed"/>
        <!-- Gear teeth -->
        <g stroke="#7c3aed" stroke-width="3">
          <line x1="50" y1="10" x2="50" y2="20"/>
          <line x1="50" y1="80" x2="50" y2="90"/>
          <line x1="10" y1="50" x2="20" y2="50"/>
          <line x1="80" y1="50" x2="90" y2="50"/>
        </g>
      </g>
    </g>

    <!-- Panel 3 - Microchip -->
    <g transform="rotate(10 150 150)">
      <path d="M 60 -110 L 220 -110 L 240 -90 L 240 40 L 80 40 L 60 20 Z" fill="url(#panelGrad)" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
      <g transform="translate(100, -80)">
        <rect x="20" y="20" width="60" height="60" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
        <rect x="30" y="30" width="40" height="40" fill="none" stroke="#3b82f6" stroke-width="1"/>
        <!-- Chip pins -->
        <g stroke="#06b6d4" stroke-width="2">
          <line x1="30" y1="15" x2="30" y2="20"/>
          <line x1="50" y1="15" x2="50" y2="20"/>
          <line x1="70" y1="15" x2="70" y2="20"/>
          <line x1="30" y1="80" x2="30" y2="85"/>
          <line x1="50" y1="80" x2="50" y2="85"/>
          <line x1="70" y1="80" x2="70" y2="85"/>
          <line x1="15" y1="40" x2="20" y2="40"/>
          <line x1="15" y1="60" x2="20" y2="60"/>
          <line x1="80" y1="40" x2="85" y2="40"/>
          <line x1="80" y1="60" x2="85" y2="60"/>
        </g>
      </g>
    </g>

    <!-- Panel 4 - Hexagons/Molecular -->
    <g transform="rotate(35 150 150)">
      <path d="M 100 -150 L 250 -150 L 270 -130 L 270 -10 L 120 -10 L 100 -30 Z" fill="url(#panelGrad)" stroke="#ec4899" stroke-width="1" opacity="0.5"/>
      <g transform="translate(140, -120)">
        <polygon points="30,0 60,15 60,45 30,60 0,45 0,15" fill="none" stroke="#ec4899" stroke-width="2"/>
        <polygon points="70,30 100,45 100,75 70,90 40,75 40,45" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
        <circle cx="30" cy="30" r="5" fill="#ec4899"/>
        <circle cx="70" cy="60" r="4" fill="#f472b6"/>
      </g>
    </g>

    <!-- Panel 5 - Circuit/Network -->
    <g transform="rotate(60 150 150)">
      <path d="M 140 -180 L 280 -180 L 300 -160 L 300 -50 L 160 -50 L 140 -70 Z" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1" opacity="0.4"/>
      <g transform="translate(180, -160)">
        <circle cx="30" cy="30" r="6" fill="#10b981"/>
        <circle cx="70" cy="50" r="6" fill="#10b981"/>
        <circle cx="50" cy="80" r="6" fill="#10b981"/>
        <line x1="30" y1="30" x2="70" y2="50" stroke="#10b981" stroke-width="2"/>
        <line x1="70" y1="50" x2="50" y2="80" stroke="#10b981" stroke-width="2"/>
        <line x1="50" y1="80" x2="30" y2="30" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
      </g>
    </g>

    <!-- Panel 6 - Lock/Security -->
    <g transform="rotate(85 150 150)">
      <path d="M 180 -200 L 310 -200 L 330 -180 L 330 -80 L 200 -80 L 180 -100 Z" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
      <g transform="translate(220, -180)">
        <rect x="20" y="40" width="50" height="40" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <path d="M 30 40 L 30 25 Q 30 10 45 10 Q 60 10 60 25 L 60 40" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <circle cx="45" cy="55" r="6" fill="#f59e0b"/>
      </g>
    </g>

    <!-- Panel 7 - Globe/World -->
    <g transform="rotate(110 150 150)">
      <path d="M 220 -210 L 340 -210 L 360 -190 L 360 -100 L 240 -100 L 220 -120 Z" fill="url(#panelGrad)" stroke="#8b5cf6" stroke-width="1" opacity="0.35"/>
      <g transform="translate(260, -190)">
        <circle cx="40" cy="40" r="30" fill="none" stroke="#8b5cf6" stroke-width="2"/>
        <ellipse cx="40" cy="40" rx="30" ry="12" fill="none" stroke="#8b5cf6" stroke-width="1"/>
        <ellipse cx="40" cy="40" rx="12" ry="30" fill="none" stroke="#8b5cf6" stroke-width="1"/>
        <line x1="10" y1="40" x2="70" y2="40" stroke="#a78bfa" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- Main AI Face -->
  <g transform="translate(100, 180)">
    <!-- Head outline/shell - Left half showing -->
    <path d="M 300 50
             Q 420 50 470 150
             Q 520 280 480 420
             Q 450 530 350 580
             Q 280 610 220 580
             Q 140 530 110 420
             Q 70 280 120 150
             Q 170 50 300 50"
          fill="url(#faceGrad)" stroke="url(#metalGrad)" stroke-width="4"/>

    <!-- Mechanical half (right side) -->
    <clipPath id="rightHalf">
      <rect x="280" y="40" width="250" height="560"/>
    </clipPath>
    <g clip-path="url(#rightHalf)">
      <!-- Mechanical frame -->
      <path d="M 300 50
               Q 420 50 470 150
               Q 520 280 480 420
               Q 450 530 350 580
               Q 280 610 280 580
               L 280 50"
            fill="url(#metalGrad)" stroke="#64748b" stroke-width="2"/>

      <!-- Exposed circuits -->
      <g transform="translate(300, 150)">
        <!-- Circuit lines -->
        <path d="M 20 0 L 20 50 L 60 50 L 60 100" stroke="#3b82f6" stroke-width="2" fill="none"/>
        <path d="M 50 20 L 80 20 L 80 80" stroke="#06b6d4" stroke-width="2" fill="none"/>
        <path d="M 30 70 L 100 70 L 100 120" stroke="#7c3aed" stroke-width="2" fill="none"/>

        <!-- Connection nodes -->
        <circle cx="20" cy="0" r="4" fill="#3b82f6"/>
        <circle cx="60" cy="100" r="4" fill="#3b82f6"/>
        <circle cx="80" cy="80" r="3" fill="#06b6d4"/>
        <circle cx="100" cy="120" r="3" fill="#7c3aed"/>
      </g>

      <!-- Mechanical joints -->
      <circle cx="380" cy="200" r="25" fill="#475569" stroke="#64748b" stroke-width="2"/>
      <circle cx="380" cy="200" r="15" fill="#334155"/>
      <circle cx="380" cy="200" r="6" fill="#3b82f6" filter="url(#glow)"/>

      <circle cx="420" cy="350" r="20" fill="#475569" stroke="#64748b" stroke-width="2"/>
      <circle cx="420" cy="350" r="10" fill="#334155"/>
      <circle cx="420" cy="350" r="4" fill="#06b6d4" filter="url(#glow)"/>

      <!-- Wires/Cables -->
      <g transform="translate(350, 400)">
        <path d="M 0 0 Q 30 50 20 100 Q 10 150 30 180" stroke="#ef4444" stroke-width="4" fill="none"/>
        <path d="M 15 0 Q 45 40 40 90 Q 35 140 50 170" stroke="#f97316" stroke-width="3" fill="none"/>
        <path d="M 30 10 Q 50 60 55 110 Q 60 160 70 180" stroke="#3b82f6" stroke-width="3" fill="none"/>
      </g>
    </g>

    <!-- Central eye piece -->
    <g transform="translate(285, 200)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="url(#glowBlue)" stroke-width="6"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>

      <!-- Inner mechanics -->
      <circle cx="0" cy="0" r="55" fill="#0f172a"/>
      <circle cx="0" cy="0" r="45" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="30" fill="#1d4ed8"/>
      <circle cx="0" cy="0" r="18" fill="#3b82f6" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>

      <!-- Rotating elements -->
      <g>
        <circle cx="0" cy="-60" r="5" fill="#06b6d4">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <circle cx="60" cy="0" r="4" fill="#7c3aed">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Facial contour lines on human side -->
    <g transform="translate(120, 150)" opacity="0.3">
      <path d="M 80 50 Q 60 100 70 150" stroke="#6366f1" stroke-width="1" fill="none"/>
      <path d="M 100 80 Q 85 120 90 180" stroke="#6366f1" stroke-width="1" fill="none"/>
      <path d="M 120 100 Q 110 150 115 200" stroke="#6366f1" stroke-width="1" fill="none"/>
    </g>

    <!-- Neck/Shoulders -->
    <g transform="translate(200, 560)">
      <!-- Central neck -->
      <rect x="50" y="0" width="100" height="80" fill="url(#metalGrad)"/>

      <!-- Shoulder plates -->
      <path d="M -50 30 Q 0 20 50 30 L 50 80 L -50 80 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="2"/>
      <path d="M 150 30 Q 200 20 250 30 L 250 80 L 150 80 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="2"/>

      <!-- Circular joints -->
      <circle cx="100" cy="40" r="30" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="100" cy="40" r="20" fill="#334155"/>
      <circle cx="100" cy="40" r="10" fill="#3b82f6" filter="url(#glow)"/>

      <!-- Glowing accents -->
      <circle cx="20" cy="55" r="6" fill="#06b6d4" filter="url(#glow)"/>
      <circle cx="180" cy="55" r="6" fill="#06b6d4" filter="url(#glow)"/>
    </g>

    <!-- Circuit patterns around head -->
    <g opacity="0.6">
      <!-- Left side circuits -->
      <path d="M 100 250 L 80 250 L 80 320 L 60 320" stroke="#7c3aed" stroke-width="2" fill="none"/>
      <circle cx="60" cy="320" r="4" fill="#7c3aed"/>

      <path d="M 120 380 L 90 380 L 90 420 L 70 420" stroke="#3b82f6" stroke-width="2" fill="none"/>
      <circle cx="70" cy="420" r="3" fill="#3b82f6"/>

      <!-- Right side data flow -->
      <path d="M 450 280 L 480 280 L 480 330" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="5 3">
        <animate attributeName="stroke-dashoffset" values="0;16" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Floating tech elements around face -->
  <g>
    <!-- Top left orb -->
    <circle cx="80" cy="150" r="15" fill="url(#heroMainGrad)" opacity="0.6">
      <animate attributeName="cy" values="150;140;150" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Bottom right orb -->
    <circle cx="650" cy="700" r="20" fill="#7c3aed" opacity="0.4">
      <animate attributeName="cy" values="700;710;700" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Data particles -->
    <circle cx="100" cy="400" r="4" fill="#3b82f6" opacity="0.8">
      <animate attributeName="cy" values="400;380;400" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="350" r="5" fill="#06b6d4" opacity="0.7">
      <animate attributeName="cy" values="350;365;350" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="500" r="3" fill="#ec4899" opacity="0.6">
      <animate attributeName="cy" values="500;490;500" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Scanning line effect -->
  <line x1="100" y1="300" x2="700" y2="300" stroke="url(#glowBlue)" stroke-width="1" opacity="0.3">
    <animate attributeName="y1" values="200;700;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="200;700;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite"/>
  </line>
</svg>