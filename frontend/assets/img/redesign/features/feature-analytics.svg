<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Dashboard background -->
  <rect x="30" y="20" width="340" height="280" rx="20" fill="url(#dashGrad)" filter="url(#cardShadow)"/>

  <!-- Header -->
  <rect x="50" y="40" width="120" height="25" rx="5" fill="#334155"/>
  <text x="60" y="57" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="bold">Analytics Dashboard</text>

  <!-- Stat cards row -->
  <g transform="translate(50, 80)">
    <!-- Views card -->
    <rect x="0" y="0" width="90" height="55" rx="8" fill="#334155"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Profile Views</text>
    <text x="10" y="42" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">12.5K</text>
    <g transform="translate(65, 30)">
      <path d="M 0 10 L 5 5 L 10 8 L 15 0" stroke="#10b981" stroke-width="2" fill="none"/>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="7" fill="#10b981">+24%</text>
    </g>

    <!-- Taps card -->
    <rect x="100" y="0" width="90" height="55" rx="8" fill="#334155"/>
    <text x="110" y="20" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Card Taps</text>
    <text x="110" y="42" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">3,842</text>
    <g transform="translate(165, 30)">
      <path d="M 0 10 L 5 6 L 10 9 L 15 2" stroke="#10b981" stroke-width="2" fill="none"/>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="7" fill="#10b981">+18%</text>
    </g>

    <!-- Contacts card -->
    <rect x="200" y="0" width="90" height="55" rx="8" fill="#334155"/>
    <text x="210" y="20" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">New Contacts</text>
    <text x="210" y="42" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">847</text>
    <g transform="translate(265, 30)">
      <path d="M 0 8 L 5 4 L 10 6 L 15 0" stroke="#10b981" stroke-width="2" fill="none"/>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="7" fill="#10b981">+32%</text>
    </g>
  </g>

  <!-- Bar chart -->
  <g transform="translate(50, 155)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="bold">Weekly Activity</text>

    <!-- Chart area -->
    <g transform="translate(0, 15)">
      <!-- Grid lines -->
      <line x1="25" y1="0" x2="290" y2="0" stroke="#475569" stroke-width="0.5" stroke-dasharray="4 4"/>
      <line x1="25" y1="30" x2="290" y2="30" stroke="#475569" stroke-width="0.5" stroke-dasharray="4 4"/>
      <line x1="25" y1="60" x2="290" y2="60" stroke="#475569" stroke-width="0.5" stroke-dasharray="4 4"/>
      <line x1="25" y1="90" x2="290" y2="90" stroke="#475569" stroke-width="0.5"/>

      <!-- Bars -->
      <rect x="35" y="50" width="25" height="40" rx="4" fill="url(#barGrad1)">
        <animate attributeName="height" values="0;40" dur="0.5s" fill="freeze"/>
        <animate attributeName="y" values="90;50" dur="0.5s" fill="freeze"/>
      </rect>
      <rect x="70" y="25" width="25" height="65" rx="4" fill="url(#barGrad2)">
        <animate attributeName="height" values="0;65" dur="0.5s" begin="0.1s" fill="freeze"/>
        <animate attributeName="y" values="90;25" dur="0.5s" begin="0.1s" fill="freeze"/>
      </rect>
      <rect x="105" y="35" width="25" height="55" rx="4" fill="url(#barGrad3)">
        <animate attributeName="height" values="0;55" dur="0.5s" begin="0.2s" fill="freeze"/>
        <animate attributeName="y" values="90;35" dur="0.5s" begin="0.2s" fill="freeze"/>
      </rect>
      <rect x="140" y="15" width="25" height="75" rx="4" fill="url(#barGrad1)">
        <animate attributeName="height" values="0;75" dur="0.5s" begin="0.3s" fill="freeze"/>
        <animate attributeName="y" values="90;15" dur="0.5s" begin="0.3s" fill="freeze"/>
      </rect>
      <rect x="175" y="40" width="25" height="50" rx="4" fill="url(#barGrad2)">
        <animate attributeName="height" values="0;50" dur="0.5s" begin="0.4s" fill="freeze"/>
        <animate attributeName="y" values="90;40" dur="0.5s" begin="0.4s" fill="freeze"/>
      </rect>
      <rect x="210" y="20" width="25" height="70" rx="4" fill="url(#barGrad3)">
        <animate attributeName="height" values="0;70" dur="0.5s" begin="0.5s" fill="freeze"/>
        <animate attributeName="y" values="90;20" dur="0.5s" begin="0.5s" fill="freeze"/>
      </rect>
      <rect x="245" y="10" width="25" height="80" rx="4" fill="url(#barGrad1)">
        <animate attributeName="height" values="0;80" dur="0.5s" begin="0.6s" fill="freeze"/>
        <animate attributeName="y" values="90;10" dur="0.5s" begin="0.6s" fill="freeze"/>
      </rect>

      <!-- X-axis labels -->
      <text x="42" y="105" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Mon</text>
      <text x="77" y="105" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Tue</text>
      <text x="112" y="105" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Wed</text>
      <text x="147" y="105" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Thu</text>
      <text x="182" y="105" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Fri</text>
      <text x="217" y="105" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Sat</text>
      <text x="252" y="105" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Sun</text>
    </g>
  </g>

  <!-- Floating elements -->
  <circle cx="360" cy="60" r="8" fill="#7c3aed" opacity="0.6">
    <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25" cy="150" r="6" fill="#3b82f6" opacity="0.5">
    <animate attributeName="cy" values="150;160;150" dur="4s" repeatCount="indefinite"/>
  </circle>
  <rect x="370" y="200" width="12" height="12" rx="2" fill="#ec4899" opacity="0.4" transform="rotate(15 376 206)">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>