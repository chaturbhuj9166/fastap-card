<svg width="400" height="350" viewBox="0 0 400 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pulseGrad1">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    <filter id="softShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circles -->
  <circle cx="200" cy="175" r="150" fill="url(#pulseGrad1)">
    <animate attributeName="r" values="150;160;150" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="175" r="120" fill="url(#pulseGrad1)" opacity="0.5">
    <animate attributeName="r" values="120;130;120" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Phone -->
  <g transform="translate(220, 60)" filter="url(#softShadow1)">
    <rect x="0" y="0" width="120" height="220" rx="15" fill="url(#phoneGrad1)" stroke="#475569" stroke-width="2"/>
    <rect x="5" y="10" width="110" height="170" rx="8" fill="#0f172a"/>

    <!-- Screen content - Profile being loaded -->
    <g transform="translate(20, 30)">
      <!-- Profile picture circle -->
      <circle cx="40" cy="30" r="25" fill="#334155"/>
      <circle cx="40" cy="30" r="22" fill="url(#cardGrad1)" opacity="0.3"/>
      <path d="M 40 20 Q 50 15 55 25 Q 55 35 45 40 Q 35 40 30 35 Q 25 25 30 20 Q 35 15 40 20" fill="#a855f7"/>

      <!-- Name placeholder -->
      <rect x="0" y="65" width="80" height="10" rx="3" fill="#475569"/>

      <!-- Info lines -->
      <rect x="0" y="85" width="60" height="6" rx="2" fill="#334155"/>
      <rect x="0" y="97" width="70" height="6" rx="2" fill="#334155"/>

      <!-- Social icons -->
      <circle cx="15" cy="125" r="10" fill="#3b82f6" opacity="0.8"/>
      <circle cx="40" cy="125" r="10" fill="#ec4899" opacity="0.8"/>
      <circle cx="65" cy="125" r="10" fill="#10b981" opacity="0.8"/>
    </g>

    <!-- Home button -->
    <circle cx="60" cy="200" r="10" fill="#334155"/>
  </g>

  <!-- NFC Card -->
  <g transform="translate(50, 100) rotate(-15)" filter="url(#softShadow1)">
    <rect x="0" y="0" width="130" height="85" rx="10" fill="url(#cardGrad1)" stroke="#9333ea" stroke-width="2"/>

    <!-- Card chip -->
    <rect x="12" y="15" width="30" height="22" rx="3" fill="#fbbf24" stroke="#f97316" stroke-width="1"/>
    <g stroke="#000000" stroke-width="0.7" opacity="0.3">
      <line x1="16" y1="18" x2="16" y2="34"/>
      <line x1="21" y1="18" x2="21" y2="34"/>
      <line x1="26" y1="18" x2="26" y2="34"/>
      <line x1="31" y1="18" x2="31" y2="34"/>
      <line x1="36" y1="18" x2="36" y2="34"/>
    </g>

    <!-- Card text -->
    <text x="55" y="28" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">FASTAP</text>
    <rect x="12" y="50" width="80" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
    <rect x="12" y="60" width="50" height="4" rx="2" fill="#ffffff" opacity="0.3"/>

    <!-- NFC symbol -->
    <g transform="translate(95, 50)">
      <path d="M 0 0 Q 18 0 18 18" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
      <path d="M 0 6 Q 12 6 12 18" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
      <circle cx="0" cy="18" r="2.5" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>

  <!-- Connection waves -->
  <g transform="translate(165, 160)">
    <path d="M 0 0 Q 25 -15 50 0" stroke="#3b82f6" stroke-width="3" fill="none" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M -5 0 Q 25 -25 55 0" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M -10 0 Q 25 -35 60 0" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Data transfer dots -->
  <circle cx="150" cy="150" r="4" fill="#ec4899">
    <animate attributeName="cx" values="150;230" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="170" r="3" fill="#a855f7">
    <animate attributeName="cx" values="145;225" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="160" r="3.5" fill="#7c3aed">
    <animate attributeName="cx" values="155;235" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- Checkmark indicator -->
  <g transform="translate(330, 80)">
    <circle cx="0" cy="0" r="20" fill="#10b981" opacity="0.2">
      <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="15" fill="#10b981"/>
    <path d="M -6 0 L -2 4 L 6 -5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>