<svg width="380" height="480" viewBox="0 0 380 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="signalGlow">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Wireless signal waves (large emanating from robot) -->
  <g opacity="0.3">
    <circle cx="190" cy="240" r="140" stroke="#ec4899" stroke-width="2" fill="none"/>
    <circle cx="190" cy="240" r="160" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="190" cy="240" r="180" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- Robot Head -->
  <g id="head">
    <rect x="140" y="70" width="100" height="95" rx="22" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="3"/>

    <!-- Antenna with wireless broadcast -->
    <line x1="190" y1="70" x2="190" y2="35" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <circle cx="190" cy="28" r="10" fill="url(#accentGrad)"/>

    <!-- Wireless waves from antenna -->
    <path d="M 170 30 Q 165 20 160 10" stroke="#ec4899" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 175 32 Q 170 22 165 12" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 210 30 Q 215 20 220 10" stroke="#ec4899" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 205 32 Q 210 22 215 12" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Eyes with digital display look -->
    <rect x="155" y="100" width="25" height="18" rx="4" fill="#60a5fa"/>
    <rect x="200" y="100" width="25" height="18" rx="4" fill="#60a5fa"/>
    <rect x="158" y="103" width="6" height="12" fill="#ffffff"/>
    <rect x="203" y="103" width="6" height="12" fill="#ffffff"/>

    <!-- Digital smile -->
    <path d="M 160 140 L 170 145 L 180 148 L 190 148 L 200 148 L 210 145 L 220 140" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Status indicator lights -->
    <circle cx="155" cy="85" r="4" fill="#10b981"/>
    <circle cx="165" cy="85" r="4" fill="#3b82f6" opacity="0.6"/>
    <circle cx="175" cy="85" r="4" fill="#ec4899" opacity="0.6"/>
  </g>

  <!-- Robot Body -->
  <g id="body">
    <rect x="125" y="175" width="130" height="145" rx="25" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="3"/>

    <!-- Chest screen showing wireless connectivity -->
    <rect x="145" y="200" width="90" height="90" rx="12" fill="url(#screenGrad)"/>

    <!-- Wireless icon on screen -->
    <g transform="translate(190, 245)">
      <!-- WiFi/NFC symbol -->
      <path d="M -25 10 Q -25 -10 -10 -20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M -10 10 Q -10 -5 0 -10" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="5" r="3" fill="#ffffff"/>

      <!-- Signal bars -->
      <rect x="10" y="5" width="5" height="10" rx="1" fill="#ffffff"/>
      <rect x="17" y="0" width="5" height="15" rx="1" fill="#ffffff" opacity="0.8"/>
      <rect x="24" y="-5" width="5" height="20" rx="1" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Side panels -->
    <rect x="135" y="210" width="6" height="70" rx="2" fill="#ffffff" opacity="0.2"/>
    <rect x="239" y="210" width="6" height="70" rx="2" fill="#ffffff" opacity="0.2"/>

    <!-- Power indicator -->
    <circle cx="190" cy="305" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Arms -->
  <g id="arms">
    <!-- Left arm - gesture pointing up/forward -->
    <rect x="70" y="195" width="45" height="90" rx="18" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="3"/>
    <circle cx="92" cy="295" r="22" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="3"/>

    <!-- Left hand with pointing gesture -->
    <ellipse cx="75" cy="270" rx="18" ry="28" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="2" transform="rotate(-25 75 270)"/>

    <!-- Wireless signal from left hand -->
    <g opacity="0.6">
      <path d="M 60 250 Q 50 240 45 230" stroke="#f472b6" stroke-width="2" fill="none"/>
      <path d="M 55 252 Q 45 242 40 232" stroke="#f472b6" stroke-width="1.5" fill="none" opacity="0.7"/>
      <circle cx="35" cy="225" r="3" fill="#f472b6"/>
    </g>

    <!-- Right arm -->
    <rect x="265" y="195" width="45" height="90" rx="18" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="3"/>
    <circle cx="288" cy="295" r="22" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="3"/>

    <!-- Right hand with open palm -->
    <ellipse cx="305" cy="270" rx="18" ry="28" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="2" transform="rotate(25 305 270)"/>

    <!-- Data particles from right hand -->
    <circle cx="320" cy="255" r="3" fill="#60a5fa" opacity="0.8"/>
    <circle cx="325" cy="245" r="2" fill="#a855f7" opacity="0.8"/>
    <circle cx="318" cy="240" r="2.5" fill="#ec4899" opacity="0.8"/>
  </g>

  <!-- Legs -->
  <g id="legs">
    <rect x="145" y="330" width="38" height="105" rx="15" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="3"/>
    <rect x="197" y="330" width="38" height="105" rx="15" fill="url(#bodyGrad)" stroke="#6d28d9" stroke-width="3"/>

    <!-- Feet -->
    <ellipse cx="164" cy="440" rx="28" ry="16" fill="#6d28d9"/>
    <ellipse cx="216" cy="440" rx="28" ry="16" fill="#6d28d9"/>

    <!-- Foot details -->
    <ellipse cx="164" cy="440" rx="18" ry="10" fill="#7c3aed" opacity="0.5"/>
    <ellipse cx="216" cy="440" rx="18" ry="10" fill="#7c3aed" opacity="0.5"/>
  </g>

  <!-- Floating geometric connection nodes -->
  <g id="floatingElements" opacity="0.5">
    <circle cx="60" cy="140" r="6" fill="#ec4899"/>
    <circle cx="320" cy="150" r="5" fill="#a855f7"/>
    <circle cx="75" cy="370" r="4" fill="#3b82f6"/>
    <circle cx="310" cy="360" r="6" fill="#f472b6"/>

    <!-- Connection lines -->
    <line x1="60" y1="140" x2="75" y2="370" stroke="#ec4899" stroke-width="1" opacity="0.3"/>
    <line x1="320" y1="150" x2="310" y2="360" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Data transfer visualization (small dots moving) -->
  <circle cx="120" cy="180" r="2" fill="#60a5fa">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 0 0 Q 20 -40 40 -80"/>
  </circle>
  <circle cx="260" cy="180" r="2" fill="#ec4899">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 0 0 Q -20 -40 -40 -80"/>
  </circle>
</svg>
