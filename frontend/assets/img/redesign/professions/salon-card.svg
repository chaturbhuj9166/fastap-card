<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="400" height="300" fill="url(#salon-grad)"/>
  <defs>
    <linearGradient id="salon-grad" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#ee0979"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
  </defs>

  <!-- Decorative Elements -->
  <circle cx="350" cy="50" r="25" fill="white" opacity="0.15"/>
  <circle cx="50" cy="250" r="35" fill="white" opacity="0.15"/>

  <!-- Scissors Icon -->
  <g transform="translate(180, 110)">
    <circle cx="-15" cy="-10" r="10" fill="white" opacity="0.8"/>
    <circle cx="15" cy="-10" r="10" fill="white" opacity="0.8"/>
    <path d="M -15 -10 L 20 30 M 15 -10 L -20 30" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="-20" y1="30" x2="20" y2="30" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Comb Icon -->
  <g transform="translate(220, 110)">
    <rect x="0" y="-20" width="30" height="8" rx="2" fill="white" opacity="0.8"/>
    <line x1="5" y1="-12" x2="5" y2="15" stroke="white" stroke-width="2"/>
    <line x1="12" y1="-12" x2="12" y2="15" stroke="white" stroke-width="2"/>
    <line x1="19" y1="-12" x2="19" y2="15" stroke="white" stroke-width="2"/>
    <line x1="26" y1="-12" x2="26" y2="15" stroke="white" stroke-width="2"/>
  </g>

  <!-- Mirror Icon -->
  <g transform="translate(200, 170)">
    <circle cx="0" cy="-10" r="25" fill="white" opacity="0.6"/>
    <rect x="-3" y="15" width="6" height="30" fill="white" opacity="0.8"/>
    <ellipse cx="0" cy="45" rx="15" ry="5" fill="white" opacity="0.8"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Salon &amp; Beauty</text>
</svg>
