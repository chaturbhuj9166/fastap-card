<svg width="320" height="200" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mfgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentMfg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect x="5" y="8" width="310" height="190" rx="15" fill="#000000" opacity="0.1"/>
  <rect x="0" y="0" width="310" height="190" rx="15" fill="url(#mfgGrad)" stroke="#4338ca" stroke-width="2"/>

  <rect x="0" y="0" width="310" height="8" rx="15" fill="url(#accentMfg)"/>
  <rect x="0" y="182" width="310" height="8" rx="15" fill="url(#accentMfg)" opacity="0.5"/>

  <!-- NFC Chip -->
  <rect x="25" y="30" width="45" height="35" rx="4" fill="#fbbf24" stroke="#f97316" stroke-width="1.5"/>
  <line x1="30" y1="35" x2="30" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="38" y1="35" x2="38" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="46" y1="35" x2="46" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="54" y1="35" x2="54" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="62" y1="35" x2="62" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>

  <!-- Factory Icon -->
  <g transform="translate(200, 35)">
    <!-- Factory building -->
    <rect x="0" y="30" width="70" height="35" fill="#ffffff" opacity="0.9"/>
    <rect x="5" y="20" width="20" height="10" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="10" width="20" height="20" fill="#ffffff" opacity="0.9"/>
    <!-- Windows -->
    <rect x="8" y="38" width="8" height="10" fill="#6366f1"/>
    <rect x="20" y="38" width="8" height="10" fill="#6366f1"/>
    <rect x="38" y="38" width="8" height="10" fill="#6366f1"/>
    <rect x="54" y="38" width="8" height="10" fill="#6366f1"/>
    <rect x="8" y="52" width="8" height="10" fill="#6366f1"/>
    <rect x="20" y="52" width="8" height="10" fill="#6366f1"/>
    <rect x="38" y="52" width="8" height="10" fill="#6366f1"/>
    <rect x="54" y="52" width="8" height="10" fill="#6366f1"/>
    <!-- Chimney smoke -->
    <circle cx="15" cy="10" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="14" cy="5" r="4" fill="#ffffff" opacity="0.4"/>
    <circle cx="40" cy="2" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="42" cy="-2" r="4" fill="#ffffff" opacity="0.4"/>
  </g>

  <text x="25" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">APEX MANUFACTURING</text>
  <text x="25" y="132" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.9">Industrial Solutions Provider</text>
  <text x="25" y="150" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.8">Quality • Precision • Innovation</text>

  <line x1="25" y1="165" x2="180" y2="165" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="173" x2="160" y2="173" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <g transform="translate(270, 155)">
    <path d="M 0 0 Q 12 0 12 12" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 0 6 Q 7 6 7 13" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="0" cy="15" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <rect x="190" y="155" width="65" height="20" rx="10" fill="#ffffff" opacity="0.2"/>
  <text x="222" y="169" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">INDUSTRIAL</text>
</svg>
