<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="400" height="300" fill="url(#political-grad)"/>
  <defs>
    <linearGradient id="political-grad" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
  </defs>

  <!-- Decorative Elements -->
  <circle cx="350" cy="60" r="30" fill="white" opacity="0.15"/>
  <circle cx="50" cy="240" r="40" fill="white" opacity="0.15"/>

  <!-- Indian Flag -->
  <g transform="translate(200, 100)">
    <rect x="-50" y="-35" width="100" height="70" fill="white"/>
    <rect x="-50" y="-35" width="100" height="23.33" fill="#ff9933"/>
    <rect x="-50" y="11.67" width="100" height="23.33" fill="#138808"/>

    <!-- Ashoka Chakra -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#000080" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#000080"/>
    <!-- Chakra Spokes (simplified) -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#000080" stroke-width="1"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#000080" stroke-width="1"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#000080" stroke-width="1"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="#000080" stroke-width="1"/>

    <!-- Flag Pole -->
    <rect x="-53" y="-35" width="3" height="120" fill="#8B4513"/>
  </g>

  <!-- Microphone Icon -->
  <g transform="translate(200, 190)">
    <rect x="-8" y="-25" width="16" height="30" rx="8" fill="white"/>
    <line x1="0" y1="5" x2="0" y2="20" stroke="white" stroke-width="3"/>
    <path d="M -15 -5 Q -15 15 0 20 Q 15 15 15 -5" stroke="white" stroke-width="3" fill="none"/>
    <line x1="-12" y1="20" x2="12" y2="20" stroke="white" stroke-width="3"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="255" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Political</text>
</svg>
