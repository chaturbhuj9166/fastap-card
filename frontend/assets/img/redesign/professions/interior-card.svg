<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="400" height="300" fill="url(#interior-grad)"/>
  <defs>
    <linearGradient id="interior-grad" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#8e2de2"/>
      <stop offset="100%" stop-color="#4a00e0"/>
    </linearGradient>
  </defs>

  <!-- Decorative Elements -->
  <circle cx="350" cy="60" r="30" fill="white" opacity="0.1"/>
  <circle cx="50" cy="240" r="40" fill="white" opacity="0.1"/>

  <!-- House/Room Structure -->
  <g transform="translate(200, 130)">
    <!-- Walls -->
    <rect x="-60" y="-40" width="120" height="80" fill="white" opacity="0.9"/>

    <!-- Roof -->
    <polygon points="0,-60 -70,-40 70,-40" fill="white"/>

    <!-- Window -->
    <rect x="-35" y="-25" width="30" height="25" fill="#8e2de2" opacity="0.6"/>
    <line x1="-35" y1="-12.5" x2="-5" y2="-12.5" stroke="white" stroke-width="2"/>
    <line x1="-20" y1="-25" x2="-20" y2="0" stroke="white" stroke-width="2"/>

    <!-- Door -->
    <rect x="10" y="-5" width="25" height="45" rx="2" fill="#8e2de2" opacity="0.6"/>
    <circle cx="28" cy="17.5" r="2" fill="white"/>

    <!-- Sofa -->
    <rect x="-50" y="15" width="35" height="20" rx="2" fill="white" opacity="0.7"/>
    <rect x="-50" y="10" width="5" height="25" fill="white" opacity="0.7"/>
    <rect x="-20" y="10" width="5" height="25" fill="white" opacity="0.7"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Interior Design</text>
</svg>
