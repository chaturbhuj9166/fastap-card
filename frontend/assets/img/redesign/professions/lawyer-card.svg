<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="400" height="300" fill="url(#lawyer-grad)"/>
  <defs>
    <linearGradient id="lawyer-grad" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#34495e"/>
    </linearGradient>
  </defs>

  <!-- Decorative Gold Elements -->
  <circle cx="350" cy="50" r="25" fill="#f1c40f" opacity="0.2"/>
  <circle cx="50" cy="250" r="35" fill="#f1c40f" opacity="0.2"/>

  <!-- Scales of Justice -->
  <g transform="translate(200, 130)">
    <!-- Stand -->
    <rect x="-3" y="-50" width="6" height="100" fill="#f1c40f"/>
    <rect x="-30" y="50" width="60" height="8" rx="4" fill="#f1c40f"/>

    <!-- Balance Beam -->
    <rect x="-50" y="-60" width="100" height="4" fill="white"/>
    <circle cx="0" cy="-60" r="6" fill="white"/>

    <!-- Left Pan -->
    <line x1="-40" y1="-60" x2="-40" y2="-40" stroke="white" stroke-width="2"/>
    <ellipse cx="-40" cy="-35" rx="15" ry="5" fill="white"/>

    <!-- Right Pan -->
    <line x1="40" y1="-60" x2="40" y2="-40" stroke="white" stroke-width="2"/>
    <ellipse cx="40" cy="-35" rx="15" ry="5" fill="white"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Legal Services</text>
</svg>
