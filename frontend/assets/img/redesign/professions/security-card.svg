<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="400" height="300" fill="url(#security-grad)"/>
  <defs>
    <linearGradient id="security-grad" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#243b55"/>
    </linearGradient>
  </defs>

  <!-- Decorative Elements -->
  <circle cx="350" cy="50" r="25" fill="#00d4ff" opacity="0.2"/>
  <circle cx="50" cy="250" r="35" fill="#00d4ff" opacity="0.2"/>

  <!-- CCTV Camera -->
  <g transform="translate(200, 110)">
    <!-- Camera Body -->
    <rect x="-30" y="-15" width="60" height="30" rx="5" fill="white"/>
    <circle cx="10" cy="0" r="12" fill="#141e30"/>
    <circle cx="10" cy="0" r="8" fill="#00d4ff"/>

    <!-- Camera Mount -->
    <path d="M -30 -5 L -45 -20 L -45 -30 L -35 -30" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Indicator Light -->
    <circle cx="-20" cy="-8" r="3" fill="#ff0000"/>
  </g>

  <!-- Shield Icon -->
  <g transform="translate(200, 180)">
    <path d="M 0 -25 L 25 -20 L 25 5 Q 25 20 0 30 Q -25 20 -25 5 L -25 -20 Z" fill="white" opacity="0.7"/>
    <path d="M 0 -15 L -8 -5 L -3 0 L 8 -12" stroke="#00d4ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">CCTV &amp; Security</text>
</svg>
