<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="statPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="statGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <filter id="statShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Happy customers badge -->
  <g transform="translate(20, 20)" filter="url(#statShadow)">
    <rect x="0" y="0" width="170" height="70" rx="15" fill="url(#statCard)" stroke="#334155" stroke-width="1"/>
    <circle cx="35" cy="35" r="18" fill="url(#statGreen)" opacity="0.2"/>
    <path d="M 28 35 L 32 39 L 42 29" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Happy Users</text>
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">10,000+</text>
  </g>

  <!-- 5 star rating badge -->
  <g transform="translate(210, 30)" filter="url(#statShadow)">
    <rect x="0" y="0" width="170" height="60" rx="15" fill="url(#statCard)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(20, 25)">
      <polygon points="10,0 12,7 20,7 14,11 16,18 10,14 4,18 6,11 0,7 8,7" fill="#fbbf24" transform="scale(0.7)"/>
      <polygon points="30,0 32,7 40,7 34,11 36,18 30,14 24,18 26,11 20,7 28,7" fill="#fbbf24" transform="scale(0.7)"/>
      <polygon points="50,0 52,7 60,7 54,11 56,18 50,14 44,18 46,11 40,7 48,7" fill="#fbbf24" transform="scale(0.7)"/>
      <polygon points="70,0 72,7 80,7 74,11 76,18 70,14 64,18 66,11 60,7 68,7" fill="#fbbf24" transform="scale(0.7)"/>
      <polygon points="90,0 92,7 100,7 94,11 96,18 90,14 84,18 86,11 80,7 88,7" fill="#fbbf24" transform="scale(0.7)"/>
    </g>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">4.9/5</text>
  </g>

  <!-- Satisfaction rate -->
  <g transform="translate(60, 110)" filter="url(#statShadow)">
    <rect x="0" y="0" width="150" height="65" rx="15" fill="url(#statCard)" stroke="#334155" stroke-width="1"/>
    <text x="75" y="28" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Satisfaction Rate</text>
    <text x="75" y="52" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle">99%</text>
    <!-- Progress arc -->
    <circle cx="130" cy="32" r="12" fill="none" stroke="#334155" stroke-width="3"/>
    <circle cx="130" cy="32" r="12" fill="none" stroke="url(#statGreen)" stroke-width="3" stroke-dasharray="72 76" stroke-linecap="round" transform="rotate(-90 130 32)"/>
  </g>

  <!-- Reviews count -->
  <g transform="translate(230, 115)" filter="url(#statShadow)">
    <rect x="0" y="0" width="140" height="55" rx="15" fill="url(#statCard)" stroke="#334155" stroke-width="1"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Total Reviews</text>
    <text x="70" y="45" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">5,000+</text>
  </g>

  <!-- Trust badge -->
  <g transform="translate(120, 185)" filter="url(#statShadow)">
    <rect x="0" y="0" width="160" height="50" rx="25" fill="url(#statPurple)"/>
    <text x="80" y="32" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">Trusted Brand</text>
    <circle cx="25" cy="25" r="12" fill="#ffffff" opacity="0.2"/>
    <path d="M 20 25 L 23 28 L 30 21" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="380" cy="200" r="5" fill="#7c3aed" opacity="0.5">
    <animate attributeName="cy" values="200;190;200" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="180" r="4" fill="#10b981" opacity="0.4">
    <animate attributeName="cy" values="180;190;180" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Sparkles -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="195" cy="15" r="3">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="100" r="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>