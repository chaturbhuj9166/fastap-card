<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Connection lines -->
  <line x1="45" y1="45" x2="135" y2="45" stroke="#7c3aed" stroke-width="2" opacity="0.3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="45" y1="45" x2="90" y2="135" stroke="#ec4899" stroke-width="2" opacity="0.3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="135" y1="45" x2="90" y2="135" stroke="#3b82f6" stroke-width="2" opacity="0.3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- Node 1 (top-left) -->
  <g id="node1">
    <circle cx="45" cy="45" r="18" fill="url(#nodeGrad1)" opacity="0.3"/>
    <circle cx="45" cy="45" r="12" fill="url(#nodeGrad1)"/>
    <circle cx="45" cy="45" r="20" stroke="#7c3aed" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="r" values="20;26;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Inner detail -->
    <circle cx="45" cy="45" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Node 2 (top-right) -->
  <g id="node2">
    <circle cx="135" cy="45" r="18" fill="url(#nodeGrad2)" opacity="0.3"/>
    <circle cx="135" cy="45" r="12" fill="url(#nodeGrad2)"/>
    <circle cx="135" cy="45" r="20" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="r" values="20;26;20" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Inner detail -->
    <circle cx="135" cy="45" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Node 3 (bottom-center) -->
  <g id="node3">
    <circle cx="90" cy="135" r="18" fill="url(#nodeGrad3)" opacity="0.3"/>
    <circle cx="90" cy="135" r="12" fill="url(#nodeGrad3)"/>
    <circle cx="90" cy="135" r="20" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="r" values="20;26;20" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Inner detail -->
    <circle cx="90" cy="135" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Data packets moving along connections -->
  <circle r="3" fill="#ffffff">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 45 45 L 135 45"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle r="3" fill="#ffffff">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 45 45 L 90 135"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <circle r="3" fill="#ffffff">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 135 45 L 90 135"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
