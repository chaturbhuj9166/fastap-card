<svg width="550" height="500" viewBox="0 0 550 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="testPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="testBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="testPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="testOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="testCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="testShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#7c3aed" flood-opacity="0.2"/>
    </filter>
    <filter id="avatarShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="275" cy="250" r="230" fill="#7c3aed" opacity="0.02"/>
  <circle cx="275" cy="250" r="180" fill="#3b82f6" opacity="0.02"/>

  <!-- Large quote marks -->
  <text x="50" y="100" font-family="Georgia, serif" font-size="150" fill="#7c3aed" opacity="0.1">"</text>
  <text x="450" y="450" font-family="Georgia, serif" font-size="150" fill="#7c3aed" opacity="0.1">"</text>

  <!-- Central testimonial card -->
  <g transform="translate(100, 120)" filter="url(#testShadow)">
    <rect x="0" y="0" width="350" height="200" rx="20" fill="url(#testCardGrad)" stroke="#334155" stroke-width="1"/>

    <!-- Quote icon -->
    <g transform="translate(25, 25)">
      <circle cx="0" cy="0" r="20" fill="url(#testPurpleGrad)" opacity="0.2"/>
      <text x="0" y="8" font-family="Georgia, serif" font-size="24" fill="#a855f7" text-anchor="middle">"</text>
    </g>

    <!-- Testimonial text placeholders -->
    <rect x="25" y="60" width="300" height="10" rx="3" fill="#475569"/>
    <rect x="25" y="80" width="280" height="10" rx="3" fill="#475569"/>
    <rect x="25" y="100" width="250" height="10" rx="3" fill="#475569"/>
    <rect x="25" y="120" width="200" height="10" rx="3" fill="#334155"/>

    <!-- Stars -->
    <g transform="translate(25, 150)">
      <polygon points="10,0 12,7 20,7 14,11 16,18 10,14 4,18 6,11 0,7 8,7" fill="#fbbf24"/>
      <polygon points="35,0 37,7 45,7 39,11 41,18 35,14 29,18 31,11 25,7 33,7" fill="#fbbf24"/>
      <polygon points="60,0 62,7 70,7 64,11 66,18 60,14 54,18 56,11 50,7 58,7" fill="#fbbf24"/>
      <polygon points="85,0 87,7 95,7 89,11 91,18 85,14 79,18 81,11 75,7 83,7" fill="#fbbf24"/>
      <polygon points="110,0 112,7 120,7 114,11 116,18 110,14 104,18 106,11 100,7 108,7" fill="#fbbf24"/>
    </g>

    <!-- Author info -->
    <g transform="translate(230, 155)">
      <rect x="0" y="0" width="80" height="8" rx="2" fill="#64748b"/>
      <rect x="20" y="15" width="60" height="6" rx="2" fill="#475569"/>
    </g>
  </g>

  <!-- Avatar cluster - representing multiple testimonials -->
  <!-- Central large avatar -->
  <g transform="translate(275, 80)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="40" fill="url(#testPurpleGrad)"/>
    <circle cx="0" cy="-8" r="15" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="18" rx="22" ry="15" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Left avatar -->
  <g transform="translate(150, 100)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="30" fill="url(#testBlueGrad)"/>
    <circle cx="0" cy="-6" r="11" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="13" rx="16" ry="11" fill="#ffffff" opacity="0.9"/>

    <animate attributeName="transform" type="translate" values="150,100;145,105;150,100" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Right avatar -->
  <g transform="translate(400, 100)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="30" fill="url(#testPinkGrad)"/>
    <circle cx="0" cy="-6" r="11" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="13" rx="16" ry="11" fill="#ffffff" opacity="0.9"/>

    <animate attributeName="transform" type="translate" values="400,100;405,95;400,100" dur="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- Small floating avatars around -->
  <g transform="translate(80, 200)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="20" fill="url(#testOrangeGrad)"/>
    <circle cx="0" cy="-4" r="7" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="8" rx="11" ry="8" fill="#ffffff" opacity="0.9"/>

    <animate attributeName="transform" type="translate" values="80,200;75,210;80,200" dur="5s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(470, 220)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="22" fill="#10b981"/>
    <circle cx="0" cy="-5" r="8" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="9" rx="12" ry="9" fill="#ffffff" opacity="0.9"/>

    <animate attributeName="transform" type="translate" values="470,220;475,215;470,220" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Speech bubbles showing feedback -->
  <!-- Bubble 1 -->
  <g transform="translate(50, 350)">
    <path d="M 0 0 Q -10 -30 30 -30 L 100 -30 Q 120 -30 120 -10 L 120 20 Q 120 40 100 40 L 30 40 L 10 55 L 20 40 Q 0 40 0 20 Z"
          fill="url(#testCardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="-15" width="90" height="6" rx="2" fill="#475569"/>
    <rect x="15" y="0" width="70" height="6" rx="2" fill="#475569"/>
    <rect x="15" y="15" width="50" height="6" rx="2" fill="#334155"/>

    <!-- Mini stars -->
    <g transform="translate(75, 22)" opacity="0.8">
      <polygon points="5,0 6,3 9,3 6,5 7,8 5,6 3,8 4,5 1,3 4,3" fill="#fbbf24"/>
      <polygon points="15,0 16,3 19,3 16,5 17,8 15,6 13,8 14,5 11,3 14,3" fill="#fbbf24"/>
      <polygon points="25,0 26,3 29,3 26,5 27,8 25,6 23,8 24,5 21,3 24,3" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Bubble 2 -->
  <g transform="translate(350, 360)">
    <path d="M 0 0 Q -10 -25 25 -25 L 90 -25 Q 105 -25 105 -10 L 105 15 Q 105 30 90 30 L 25 30 L 8 42 L 15 30 Q 0 30 0 15 Z"
          fill="url(#testCardGrad)" stroke="#3b82f6" stroke-width="1"/>
    <rect x="12" y="-12" width="80" height="5" rx="2" fill="#475569"/>
    <rect x="12" y="0" width="60" height="5" rx="2" fill="#475569"/>

    <!-- Thumbs up icon -->
    <g transform="translate(70, 15)">
      <circle cx="0" cy="0" r="10" fill="#3b82f6" opacity="0.2"/>
      <path d="M -3 3 L -3 -2 L 0 -5 L 2 -5 L 2 -2 L 5 -2 L 5 5 L -3 5 Z" fill="#3b82f6"/>
    </g>
  </g>

  <!-- Bubble 3 -->
  <g transform="translate(180, 400)">
    <path d="M 0 0 Q -8 -20 20 -20 L 80 -20 Q 95 -20 95 -8 L 95 15 Q 95 28 80 28 L 20 28 L 5 38 L 12 28 Q 0 28 0 15 Z"
          fill="url(#testCardGrad)" stroke="#ec4899" stroke-width="1"/>
    <rect x="10" y="-10" width="70" height="5" rx="2" fill="#475569"/>
    <rect x="10" y="2" width="55" height="5" rx="2" fill="#475569"/>

    <!-- Heart icon -->
    <g transform="translate(70, 15)">
      <path d="M 0 4 Q -8 -4 0 -6 Q 8 -4 0 4" fill="#ec4899"/>
    </g>
  </g>

  <!-- Rating badge -->
  <g transform="translate(470, 70)">
    <circle cx="0" cy="0" r="35" fill="url(#testPurpleGrad)" opacity="0.15"/>
    <circle cx="0" cy="0" r="28" fill="url(#testPurpleGrad)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle">4.9</text>
    <polygon points="0,-16 2,-10 8,-10 3,-6 5,0 0,-4 -5,0 -3,-6 -8,-10 -2,-10" fill="#fbbf24" transform="translate(0, -30) scale(0.7)"/>
  </g>

  <!-- Happy customer count indicator -->
  <g transform="translate(30, 450)">
    <rect x="0" y="0" width="130" height="40" rx="20" fill="url(#testCardGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="25" cy="20" r="12" fill="#10b981" opacity="0.2"/>
    <path d="M 20 20 L 23 23 L 30 16" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="45" y="18" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Happy Users</text>
    <text x="45" y="32" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">10,000+</text>
  </g>

  <!-- Floating decorative elements -->
  <g>
    <!-- Stars -->
    <polygon points="520,300 522,307 530,307 524,311 526,318 520,314 514,318 516,311 510,307 518,307" fill="#fbbf24" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="30,300 32,307 40,307 34,311 36,318 30,314 24,318 26,311 20,307 28,307" fill="#fbbf24" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </polygon>

    <!-- Hearts -->
    <g transform="translate(500, 400)" opacity="0.5">
      <path d="M 0 5 Q -10 -5 0 -8 Q 10 -5 0 5" fill="#ec4899"/>
      <animate attributeName="transform" type="translate" values="500,400;505,395;500,400" dur="3s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(40, 140)" opacity="0.4">
      <path d="M 0 4 Q -8 -4 0 -6 Q 8 -4 0 4" fill="#ec4899"/>
      <animate attributeName="transform" type="translate" values="40,140;35,145;40,140" dur="3.5s" repeatCount="indefinite"/>
    </g>

    <!-- Dots -->
    <circle cx="520" cy="150" r="4" fill="#7c3aed" opacity="0.4">
      <animate attributeName="cy" values="150;140;150" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="380" r="3" fill="#3b82f6" opacity="0.5">
      <animate attributeName="cy" values="380;390;380" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connection lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.2">
    <line x1="275" y1="120" x2="275" y2="140"/>
    <line x1="180" y1="100" x2="220" y2="130"/>
    <line x1="370" y1="100" x2="330" y2="130"/>
  </g>
</svg>