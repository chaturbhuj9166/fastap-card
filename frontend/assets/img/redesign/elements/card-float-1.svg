<svg width="140" height="90" viewBox="0 0 140 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.7" />
    </linearGradient>
  </defs>

  <!-- 3D perspective floating card -->
  <g transform="rotate(-15 70 45)">
    <!-- Shadow -->
    <rect x="8" y="23" width="120" height="75" rx="8" fill="#000000" opacity="0.15"/>

    <!-- Card body -->
    <rect x="10" y="20" width="120" height="75" rx="8" fill="url(#card1Grad)" stroke="#6d28d9" stroke-width="2"/>

    <!-- Chip -->
    <rect x="20" y="32" width="22" height="18" rx="3" fill="#fbbf24" stroke="#f97316" stroke-width="1"/>
    <line x1="23" y1="36" x2="23" y2="46" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
    <line x1="26" y1="36" x2="26" y2="46" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
    <line x1="29" y1="36" x2="29" y2="46" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
    <line x1="32" y1="36" x2="32" y2="46" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
    <line x1="35" y1="36" x2="35" y2="46" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
    <line x1="38" y1="36" x2="38" y2="46" stroke="#000000" stroke-width="0.5" opacity="0.3"/>

    <!-- Card details -->
    <line x1="20" y1="62" x2="100" y2="62" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="70" x2="85" y2="70" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="77" x2="75" y2="77" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

    <!-- NFC symbol -->
    <g transform="translate(110, 40)">
      <path d="M 0 0 Q 8 0 8 8" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M 0 4 Q 5 4 5 9" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7"/>
      <circle cx="0" cy="10" r="1.5" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Shine effect -->
    <rect x="15" y="25" width="35" height="50" rx="4" fill="#ffffff" opacity="0.1"/>
  </g>
</svg>
