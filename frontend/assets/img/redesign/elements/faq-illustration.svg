<svg width="500" height="550" viewBox="0 0 500 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faqBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faqCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faqAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faqPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <filter id="faqShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
    <filter id="faqGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background decorative circles -->
  <circle cx="250" cy="275" r="220" fill="#7c3aed" opacity="0.03"/>
  <circle cx="250" cy="275" r="180" fill="#3b82f6" opacity="0.03"/>
  <circle cx="250" cy="275" r="140" fill="#ec4899" opacity="0.03"/>

  <!-- Main Question Mark Bubble -->
  <g transform="translate(150, 50)" filter="url(#faqShadow)">
    <!-- Large speech bubble -->
    <path d="M 100 0
             Q 200 0 200 50
             L 200 120
             Q 200 170 150 170
             L 130 170
             L 110 200
             L 110 170
             L 50 170
             Q 0 170 0 120
             L 0 50
             Q 0 0 100 0"
          fill="url(#faqBubbleGrad)"/>

    <!-- Question mark -->
    <text x="100" y="120" font-family="Georgia, serif" font-size="100" fill="#ffffff" font-weight="bold" text-anchor="middle">?</text>
  </g>

  <!-- FAQ Cards Stack -->
  <!-- Card 1 -->
  <g transform="translate(50, 280)" filter="url(#faqShadow)">
    <rect x="0" y="0" width="400" height="70" rx="15" fill="url(#faqCardGrad)" stroke="#334155" stroke-width="1"/>

    <!-- Question icon -->
    <circle cx="35" cy="35" r="20" fill="url(#faqBubbleGrad)" opacity="0.2"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="20" fill="#a855f7" font-weight="bold" text-anchor="middle">Q</text>

    <!-- Question text placeholder -->
    <rect x="70" y="20" width="250" height="12" rx="4" fill="#475569"/>
    <rect x="70" y="40" width="180" height="10" rx="3" fill="#334155"/>

    <!-- Expand icon -->
    <g transform="translate(360, 25)">
      <circle cx="0" cy="10" r="15" fill="#334155"/>
      <path d="M -6 7 L 0 13 L 6 7" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Card 2 (slightly offset) -->
  <g transform="translate(60, 360)" filter="url(#faqShadow)">
    <rect x="0" y="0" width="400" height="70" rx="15" fill="url(#faqCardGrad)" stroke="#3b82f6" stroke-width="2"/>

    <!-- Question icon -->
    <circle cx="35" cy="35" r="20" fill="url(#faqAccentGrad)" opacity="0.2"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="20" fill="#3b82f6" font-weight="bold" text-anchor="middle">Q</text>

    <!-- Question text placeholder -->
    <rect x="70" y="20" width="280" height="12" rx="4" fill="#475569"/>
    <rect x="70" y="40" width="200" height="10" rx="3" fill="#334155"/>

    <!-- Expand icon (rotated - open state) -->
    <g transform="translate(360, 25)">
      <circle cx="0" cy="10" r="15" fill="#3b82f6" opacity="0.3"/>
      <path d="M -6 13 L 0 7 L 6 13" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(50, 440)" filter="url(#faqShadow)">
    <rect x="0" y="0" width="400" height="70" rx="15" fill="url(#faqCardGrad)" stroke="#334155" stroke-width="1"/>

    <!-- Question icon -->
    <circle cx="35" cy="35" r="20" fill="url(#faqPinkGrad)" opacity="0.2"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="20" fill="#ec4899" font-weight="bold" text-anchor="middle">Q</text>

    <!-- Question text placeholder -->
    <rect x="70" y="20" width="220" height="12" rx="4" fill="#475569"/>
    <rect x="70" y="40" width="160" height="10" rx="3" fill="#334155"/>

    <!-- Expand icon -->
    <g transform="translate(360, 25)">
      <circle cx="0" cy="10" r="15" fill="#334155"/>
      <path d="M -6 7 L 0 13 L 6 7" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Floating helper elements -->
  <!-- Light bulb (idea) -->
  <g transform="translate(420, 100)">
    <ellipse cx="0" cy="0" rx="25" ry="30" fill="#fbbf24" filter="url(#faqGlow)"/>
    <rect x="-8" y="25" width="16" height="12" rx="3" fill="#f59e0b"/>
    <line x1="-5" y1="35" x2="5" y2="35" stroke="#d97706" stroke-width="2"/>
    <line x1="-3" y1="40" x2="3" y2="40" stroke="#d97706" stroke-width="2"/>

    <!-- Light rays -->
    <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="0" y1="-40" x2="0" y2="-50">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="30" y1="-20" x2="40" y2="-30">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="-30" y1="-20" x2="-40" y2="-30">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="35" y1="10" x2="45" y2="10">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-35" y1="10" x2="-45" y2="10">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.8s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- Floating question marks -->
  <g opacity="0.4">
    <text x="80" y="180" font-family="Georgia, serif" font-size="30" fill="#7c3aed">?</text>
    <text x="400" y="250" font-family="Georgia, serif" font-size="25" fill="#3b82f6">?</text>
    <text x="60" y="530" font-family="Georgia, serif" font-size="20" fill="#ec4899">?</text>
  </g>

  <!-- Checkmark badge (answers found) -->
  <g transform="translate(30, 80)">
    <circle cx="0" cy="0" r="25" fill="#10b981" opacity="0.15">
      <animate attributeName="r" values="25;30;25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="18" fill="#10b981"/>
    <path d="M -8 0 L -3 5 L 8 -6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Search/magnifying glass -->
  <g transform="translate(450, 450)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#64748b" stroke-width="4"/>
    <line x1="15" y1="15" x2="30" y2="30" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

    <!-- Sparkle on lens -->
    <circle cx="-8" cy="-8" r="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Decorative dots -->
  <g fill="#7c3aed">
    <circle cx="470" cy="200" r="4" opacity="0.5">
      <animate attributeName="cy" values="200;190;200" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="350" r="3" opacity="0.4">
      <animate attributeName="cy" values="350;360;350" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#3b82f6">
    <circle cx="480" cy="350" r="5" opacity="0.4">
      <animate attributeName="cy" values="350;340;350" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#ec4899">
    <circle cx="20" cy="250" r="4" opacity="0.5">
      <animate attributeName="cy" values="250;260;250" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connection lines between elements -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="5 5" opacity="0.3">
    <path d="M 250 220 Q 350 240 420 150"/>
    <path d="M 250 220 Q 150 240 80 150"/>
  </g>
</svg>