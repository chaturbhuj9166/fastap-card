<svg width="400" height="280" viewBox="0 0 400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avtPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="avtBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="avtPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="avtGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="avtOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <filter id="avtShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="200" cy="140" r="120" fill="#7c3aed" opacity="0.05"/>

  <!-- Central large avatar -->
  <g transform="translate(200, 100)" filter="url(#avtShadow)">
    <circle cx="0" cy="0" r="55" fill="url(#avtPurple)"/>
    <circle cx="0" cy="-12" r="20" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="22" rx="28" ry="20" fill="#ffffff" opacity="0.9"/>
    <!-- Verified badge -->
    <g transform="translate(35, 35)">
      <circle cx="0" cy="0" r="14" fill="#10b981"/>
      <path d="M -6 0 L -2 4 L 6 -4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Left avatar -->
  <g transform="translate(80, 120)" filter="url(#avtShadow)">
    <circle cx="0" cy="0" r="40" fill="url(#avtBlue)"/>
    <circle cx="0" cy="-8" r="14" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="16" rx="20" ry="14" fill="#ffffff" opacity="0.9"/>
    <animate attributeName="transform" type="translate" values="80,120;75,125;80,120" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Right avatar -->
  <g transform="translate(320, 120)" filter="url(#avtShadow)">
    <circle cx="0" cy="0" r="40" fill="url(#avtPink)"/>
    <circle cx="0" cy="-8" r="14" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="16" rx="20" ry="14" fill="#ffffff" opacity="0.9"/>
    <animate attributeName="transform" type="translate" values="320,120;325,115;320,120" dur="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- Small avatars -->
  <g transform="translate(130, 200)" filter="url(#avtShadow)">
    <circle cx="0" cy="0" r="28" fill="url(#avtGreen)"/>
    <circle cx="0" cy="-5" r="10" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="11" rx="14" ry="10" fill="#ffffff" opacity="0.9"/>
    <animate attributeName="transform" type="translate" values="130,200;125,205;130,200" dur="5s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(270, 200)" filter="url(#avtShadow)">
    <circle cx="0" cy="0" r="28" fill="url(#avtOrange)"/>
    <circle cx="0" cy="-5" r="10" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="11" rx="14" ry="10" fill="#ffffff" opacity="0.9"/>
    <animate attributeName="transform" type="translate" values="270,200;275,195;270,200" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- Rating badge -->
  <g transform="translate(340, 40)">
    <circle cx="0" cy="0" r="30" fill="url(#avtPurple)" opacity="0.15"/>
    <circle cx="0" cy="0" r="24" fill="url(#avtPurple)"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4.9</text>
    <polygon points="0,-18 2,-12 8,-12 3,-8 5,-2 0,-6 -5,-2 -3,-8 -8,-12 -2,-12" fill="#fbbf24" transform="scale(0.6) translate(0, -15)"/>
  </g>

  <!-- Floating hearts -->
  <g fill="#ec4899" opacity="0.6">
    <path d="M 50 60 Q 42 52 50 48 Q 58 52 50 60" transform="scale(0.8)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 370 180 Q 362 172 370 168 Q 378 172 370 180" transform="scale(0.7)">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Stars -->
  <polygon points="60,240 62,247 70,247 64,251 66,258 60,254 54,258 56,251 50,247 58,247" fill="#fbbf24" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="350,250 352,257 360,257 354,261 356,268 350,264 344,268 346,261 340,257 348,257" fill="#fbbf24" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </polygon>
</svg>