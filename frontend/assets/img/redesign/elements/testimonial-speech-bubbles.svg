<svg width="400" height="280" viewBox="0 0 400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bubbleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubblePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Speech bubble 1 - Main -->
  <g transform="translate(30, 20)" filter="url(#bubbleShadow)">
    <path d="M 0 0 Q -10 -5 10 -5 L 280 -5 Q 300 -5 300 15 L 300 80 Q 300 100 280 100 L 50 100 L 25 125 L 35 100 Q 0 100 0 80 Z"
          fill="url(#bubbleCard)" stroke="#334155" stroke-width="1"/>

    <!-- Quote mark -->
    <text x="25" y="35" font-family="Georgia, serif" font-size="40" fill="#7c3aed" opacity="0.3">"</text>

    <!-- Text lines -->
    <rect x="25" y="35" width="250" height="8" rx="3" fill="#475569"/>
    <rect x="25" y="50" width="220" height="8" rx="3" fill="#475569"/>
    <rect x="25" y="65" width="180" height="8" rx="3" fill="#334155"/>

    <!-- Stars -->
    <g transform="translate(220, 78)">
      <polygon points="8,0 9,5 14,5 10,8 11,13 8,10 5,13 6,8 2,5 7,5" fill="#fbbf24"/>
      <polygon points="23,0 24,5 29,5 25,8 26,13 23,10 20,13 21,8 17,5 22,5" fill="#fbbf24"/>
      <polygon points="38,0 39,5 44,5 40,8 41,13 38,10 35,13 36,8 32,5 37,5" fill="#fbbf24"/>
      <polygon points="53,0 54,5 59,5 55,8 56,13 53,10 50,13 51,8 47,5 52,5" fill="#fbbf24"/>
      <polygon points="68,0 69,5 74,5 70,8 71,13 68,10 65,13 66,8 62,5 67,5" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Speech bubble 2 -->
  <g transform="translate(70, 140)" filter="url(#bubbleShadow)">
    <path d="M 0 0 Q -8 -4 8 -4 L 250 -4 Q 265 -4 265 12 L 265 65 Q 265 80 250 80 L 40 80 L 20 100 L 28 80 Q 0 80 0 65 Z"
          fill="url(#bubbleCard)" stroke="#3b82f6" stroke-width="1"/>

    <!-- Text lines -->
    <rect x="20" y="15" width="220" height="7" rx="3" fill="#475569"/>
    <rect x="20" y="28" width="190" height="7" rx="3" fill="#475569"/>
    <rect x="20" y="41" width="150" height="7" rx="3" fill="#334155"/>

    <!-- Thumbs up -->
    <g transform="translate(220, 50)">
      <circle cx="0" cy="0" r="12" fill="#3b82f6" opacity="0.2"/>
      <path d="M -4 4 L -4 -2 L -1 -6 L 2 -6 L 2 -2 L 6 -2 L 6 6 L -4 6 Z" fill="#3b82f6" transform="scale(0.8)"/>
    </g>
  </g>

  <!-- Small floating bubble -->
  <g transform="translate(300, 200)" filter="url(#bubbleShadow)">
    <path d="M 0 0 Q -5 -3 5 -3 L 80 -3 Q 90 -3 90 8 L 90 45 Q 90 55 80 55 L 20 55 L 8 68 L 14 55 Q 0 55 0 45 Z"
          fill="url(#bubbleCard)" stroke="#ec4899" stroke-width="1"/>

    <!-- Heart icon -->
    <g transform="translate(45, 26)">
      <path d="M 0 8 Q -12 -4 0 -8 Q 12 -4 0 8" fill="#ec4899"/>
    </g>
  </g>

  <!-- Decorative elements -->
  <circle cx="350" cy="50" r="6" fill="#7c3aed" opacity="0.5">
    <animate attributeName="cy" values="50;40;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="200" r="5" fill="#3b82f6" opacity="0.4">
    <animate attributeName="cy" values="200;210;200" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Quote marks floating -->
  <text x="360" y="120" font-family="Georgia, serif" font-size="30" fill="#7c3aed" opacity="0.2">"</text>
  <text x="10" cy="260" font-family="Georgia, serif" font-size="25" fill="#ec4899" opacity="0.2">"</text>
</svg>