<svg width="400" height="450" viewBox="0 0 400 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Question Marks Background -->
  <g opacity="0.1">
    <text x="30" y="80" font-family="Arial, sans-serif" font-size="60" fill="#7c3aed" font-weight="bold">?</text>
    <text x="300" y="150" font-family="Arial, sans-serif" font-size="50" fill="#3b82f6" font-weight="bold">?</text>
    <text x="320" y="380" font-family="Arial, sans-serif" font-size="55" fill="#ec4899" font-weight="bold">?</text>
    <text x="60" y="420" font-family="Arial, sans-serif" font-size="45" fill="#10b981" font-weight="bold">?</text>
  </g>

  <!-- Main Character - Support Person with Headset -->
  <g transform="translate(120, 100)">
    <!-- Head -->
    <circle cx="80" cy="70" r="40" fill="url(#faqGrad)"/>

    <!-- Headset -->
    <path d="M 45 60 Q 40 70 45 80" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 115 60 Q 120 70 115 80" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="35" y="70" width="15" height="18" rx="3" fill="#1e293b"/>
    <rect x="110" y="70" width="15" height="18" rx="3" fill="#1e293b"/>
    <path d="M 45 50 Q 80 35 115 50" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Microphone -->
    <line x1="125" y1="85" x2="135" y2="95" stroke="#1e293b" stroke-width="3"/>
    <rect x="133" y="93" width="8" height="12" rx="4" fill="#1e293b"/>

    <!-- Eyes -->
    <circle cx="65" cy="65" r="4" fill="#ffffff"/>
    <circle cx="95" cy="65" r="4" fill="#ffffff"/>
    <circle cx="66" cy="65" r="2" fill="#1e293b"/>
    <circle cx="96" cy="65" r="2" fill="#1e293b"/>

    <!-- Smile -->
    <path d="M 60 80 Q 80 90 100 80" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Body -->
    <rect x="52" y="110" width="56" height="80" rx="8" fill="#3b82f6"/>

    <!-- Arms -->
    <rect x="30" y="125" width="18" height="55" rx="9" fill="#3b82f6" transform="rotate(-25 39 152)"/>
    <rect x="112" y="125" width="18" height="55" rx="9" fill="#3b82f6" transform="rotate(25 121 152)"/>

    <!-- Legs -->
    <rect x="58" y="185" width="18" height="65" rx="9" fill="#7c3aed"/>
    <rect x="84" y="185" width="18" height="65" rx="9" fill="#7c3aed"/>
  </g>

  <!-- Large Question Mark Icon -->
  <g transform="translate(260, 240)">
    <circle cx="50" cy="50" r="55" fill="#ec4899" opacity="0.2"/>
    <text x="30" y="75" font-family="Arial, sans-serif" font-size="70" fill="#ec4899" font-weight="bold">?</text>
  </g>

  <!-- Info/Help Icons -->
  <g transform="translate(40, 280)">
    <circle cx="0" cy="0" r="12" fill="#10b981"/>
    <text x="-4" y="6" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">i</text>
  </g>

  <g transform="translate(100, 300)">
    <circle cx="0" cy="0" r="12" fill="#3b82f6"/>
    <text x="-4" y="6" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">i</text>
  </g>

  <!-- Speech Bubbles -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="90" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="10,40 15,50 20,40" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <line x1="10" y1="12" x2="80" y2="12" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="22" x2="70" y2="22" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="32" x2="75" y2="32" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Answer Check Mark -->
  <g transform="translate(320, 120)">
    <circle cx="0" cy="0" r="20" fill="#10b981"/>
    <path d="M -8 0 L -3 5 L 8 -7" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Lightbulb Idea Icon -->
  <g transform="translate(300, 320)">
    <circle cx="0" cy="0" r="15" fill="#fbbf24"/>
    <rect x="-5" y="12" width="10" height="8" rx="2" fill="#f59e0b"/>
    <line x1="-20" y1="0" x2="-25" y2="0" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="25" y2="0" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="0" y2="-25" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="-14" y1="-14" x2="-18" y2="-18" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="-14" x2="18" y2="-18" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Book/Guide Icon -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="50" height="40" rx="4" fill="#7c3aed"/>
    <line x1="25" y1="0" x2="25" y2="40" stroke="#ffffff" stroke-width="2"/>
    <line x1="10" y1="12" x2="20" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="20" x2="20" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="28" x2="20" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="12" x2="40" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="20" x2="40" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="28" x2="40" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
