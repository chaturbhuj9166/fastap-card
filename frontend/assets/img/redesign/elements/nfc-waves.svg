<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- Concentric NFC wave rings -->
  <circle cx="100" cy="100" r="30" stroke="url(#waveGrad)" stroke-width="3" fill="none" opacity="0.9">
    <animate attributeName="r" values="30;40;30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="100" cy="100" r="50" stroke="url(#waveGrad)" stroke-width="2.5" fill="none" opacity="0.7">
    <animate attributeName="r" values="50;60;50" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="100" cy="100" r="70" stroke="url(#waveGrad)" stroke-width="2" fill="none" opacity="0.5">
    <animate attributeName="r" values="70;80;70" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="100" cy="100" r="90" stroke="url(#waveGrad)" stroke-width="1.5" fill="none" opacity="0.3">
    <animate attributeName="r" values="90;98;90" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Center NFC icon -->
  <g transform="translate(100, 100)">
    <path d="M -10 -8 L -10 8 M -10 -8 L -2 -2 M -10 0 L -2 6" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <path d="M 2 -4 Q 8 -4 8 2 Q 8 8 2 8" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
