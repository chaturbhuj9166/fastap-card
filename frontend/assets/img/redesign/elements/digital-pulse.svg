<svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="pulseRadial">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Pulsating circles -->
  <circle cx="75" cy="75" r="20" fill="url(#pulseRadial)" opacity="0.6">
    <animate attributeName="r" values="20;60;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="75" cy="75" r="20" fill="url(#pulseRadial)" opacity="0.6">
    <animate attributeName="r" values="20;60;20" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="75" cy="75" r="20" fill="url(#pulseRadial)" opacity="0.6">
    <animate attributeName="r" values="20;60;20" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Core pulse center -->
  <circle cx="75" cy="75" r="15" fill="url(#pulseGrad)">
    <animate attributeName="r" values="15;18;15" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner white core -->
  <circle cx="75" cy="75" r="8" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating ring around pulse -->
  <circle cx="75" cy="75" r="25" stroke="#10b981" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="10 10">
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Digital scan lines -->
  <line x1="30" y1="75" x2="50" y2="75" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="100" y1="75" x2="120" y2="75" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="75" y1="30" x2="75" y2="50" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </line>
  <line x1="75" y1="100" x2="75" y2="120" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </line>

  <!-- Corner dots -->
  <circle cx="50" cy="50" r="3" fill="#10b981" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="50" r="3" fill="#10b981" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="100" r="3" fill="#10b981" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="3" fill="#10b981" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
