<svg width="320" height="200" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="realestateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentRE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect x="5" y="8" width="310" height="190" rx="15" fill="#000000" opacity="0.1"/>
  <rect x="0" y="0" width="310" height="190" rx="15" fill="url(#realestateGrad)" stroke="#6d28d9" stroke-width="2"/>

  <rect x="0" y="0" width="310" height="8" rx="15" fill="url(#accentRE)"/>
  <rect x="0" y="182" width="310" height="8" rx="15" fill="url(#accentRE)" opacity="0.5"/>

  <!-- NFC Chip -->
  <rect x="25" y="30" width="45" height="35" rx="4" fill="#fbbf24" stroke="#f97316" stroke-width="1.5"/>
  <line x1="30" y1="35" x2="30" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="38" y1="35" x2="38" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="46" y1="35" x2="46" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="54" y1="35" x2="54" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="62" y1="35" x2="62" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>

  <!-- Building/Property Icon -->
  <g transform="translate(205, 30)">
    <!-- Building -->
    <rect x="0" y="20" width="60" height="45" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,20 30,0 60,20" fill="#ffffff" opacity="0.9"/>
    <!-- Windows -->
    <rect x="8" y="28" width="10" height="12" fill="#8b5cf6"/>
    <rect x="22" y="28" width="10" height="12" fill="#8b5cf6"/>
    <rect x="42" y="28" width="10" height="12" fill="#8b5cf6"/>
    <rect x="8" y="44" width="10" height="12" fill="#8b5cf6"/>
    <rect x="22" y="44" width="10" height="12" fill="#8b5cf6"/>
    <rect x="42" y="44" width="10" height="12" fill="#8b5cf6"/>
    <!-- Door -->
    <rect x="24" y="53" width="12" height="12" fill="#6d28d9"/>
    <!-- Roof detail -->
    <circle cx="30" cy="8" r="4" fill="#fbbf24"/>
  </g>

  <text x="25" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">PRIME PROPERTIES</text>
  <text x="25" y="132" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.9">Your Dream Home Awaits</text>
  <text x="25" y="150" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.8">Buy • Sell • Invest</text>

  <line x1="25" y1="165" x2="180" y2="165" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="173" x2="160" y2="173" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <g transform="translate(270, 155)">
    <path d="M 0 0 Q 12 0 12 12" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 0 6 Q 7 6 7 13" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="0" cy="15" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <rect x="195" y="155" width="60" height="20" rx="10" fill="#ffffff" opacity="0.2"/>
  <text x="225" y="169" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">PROPERTY</text>
</svg>
