<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="400" height="300" fill="url(#solar-grad)"/>
  <defs>
    <linearGradient id="solar-grad" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#f7971e"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
  </defs>

  <!-- Decorative Elements -->
  <circle cx="350" cy="50" r="25" fill="white" opacity="0.2"/>
  <circle cx="50" cy="250" r="35" fill="white" opacity="0.2"/>

  <!-- Sun Icon -->
  <g transform="translate(200, 80)">
    <circle cx="0" cy="0" r="25" fill="white"/>
    <!-- Sun Rays -->
    <line x1="0" y1="-40" x2="0" y2="-55" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="-28" x2="39" y2="-39" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="0" x2="55" y2="0" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="39" y2="39" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="0" y2="55" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="-28" y1="28" x2="-39" y2="39" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="-40" y1="0" x2="-55" y2="0" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="-28" y1="-28" x2="-39" y2="-39" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Solar Panel -->
  <g transform="translate(200, 170)">
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="white" stroke="white" stroke-width="2"/>
    <!-- Grid Lines -->
    <line x1="-50" y1="-10" x2="50" y2="-10" stroke="#f7971e" stroke-width="1.5"/>
    <line x1="-50" y1="10" x2="50" y2="10" stroke="#f7971e" stroke-width="1.5"/>
    <line x1="-25" y1="-30" x2="-25" y2="30" stroke="#f7971e" stroke-width="1.5"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#f7971e" stroke-width="1.5"/>
    <line x1="25" y1="-30" x2="25" y2="30" stroke="#f7971e" stroke-width="1.5"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Solar Energy</text>
</svg>
