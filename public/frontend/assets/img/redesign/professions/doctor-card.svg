<svg width="320" height="200" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doctorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentDoc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Card base with 3D effect -->
  <rect x="5" y="8" width="310" height="190" rx="15" fill="#000000" opacity="0.1"/>
  <rect x="0" y="0" width="310" height="190" rx="15" fill="url(#doctorGrad)" stroke="#0e7490" stroke-width="2"/>

  <!-- Accent stripe -->
  <rect x="0" y="0" width="310" height="8" rx="15" fill="url(#accentDoc)"/>
  <rect x="0" y="182" width="310" height="8" rx="15" fill="url(#accentDoc)" opacity="0.5"/>

  <!-- NFC Chip -->
  <rect x="25" y="30" width="45" height="35" rx="4" fill="#fbbf24" stroke="#f97316" stroke-width="1.5"/>
  <g id="chipLines">
    <line x1="30" y1="35" x2="30" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
    <line x1="35" y1="35" x2="35" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
    <line x1="40" y1="35" x2="40" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
    <line x1="45" y1="35" x2="45" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
    <line x1="50" y1="35" x2="50" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
    <line x1="55" y1="35" x2="55" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
    <line x1="60" y1="35" x2="60" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
    <line x1="65" y1="35" x2="65" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Medical Icon - Stethoscope -->
  <g transform="translate(220, 40)">
    <!-- Stethoscope -->
    <circle cx="20" cy="50" r="12" stroke="#ffffff" stroke-width="3" fill="none"/>
    <path d="M 20 38 Q 20 20 10 10 M 20 38 Q 20 20 30 10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="10" cy="8" r="6" fill="#ffffff"/>
    <circle cx="30" cy="8" r="6" fill="#ffffff"/>
    <line x1="32" y1="50" x2="45" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="8" fill="#ffffff"/>
    <circle cx="50" cy="50" r="5" fill="#06b6d4"/>
  </g>

  <!-- Medical Cross -->
  <g transform="translate(140, 95)">
    <rect x="-5" y="-15" width="10" height="30" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="-15" y="-5" width="30" height="10" rx="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Card details -->
  <text x="25" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">DR. JOHN DOE</text>
  <text x="25" y="132" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.9">Cardiologist</text>
  <text x="25" y="150" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.8">MD, MBBS, Specialist</text>

  <!-- Contact lines -->
  <line x1="25" y1="165" x2="180" y2="165" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="173" x2="160" y2="173" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- NFC Symbol -->
  <g transform="translate(270, 155)">
    <path d="M 0 0 Q 12 0 12 12" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 0 6 Q 7 6 7 13" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="0" cy="15" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Profession Badge -->
  <rect x="200" y="155" width="55" height="20" rx="10" fill="#ffffff" opacity="0.2"/>
  <text x="227" y="169" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">MEDICAL</text>
</svg>
