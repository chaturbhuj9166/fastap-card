  </defs>

  <rect x="5" y="8" width="310" height="190" rx="15" fill="#000000" opacity="0.1"/>
  <rect x="0" y="0" width="310" height="190" rx="15" fill="url(#multiGrad)" stroke="#0f766e" stroke-width="2"/>

  <rect x="0" y="0" width="310" height="8" rx="15" fill="url(#accentMulti)"/>
  <rect x="0" y="182" width="310" height="8" rx="15" fill="url(#accentMulti)" opacity="0.5"/>

  <rect x="25" y="30" width="45" height="35" rx="4" fill="#fbbf24" stroke="#f97316" stroke-width="1.5"/>
  <line x1="30" y1="35" x2="30" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="38" y1="35" x2="38" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
  <line x1="46" y1="35" x2="46" y2="60" stroke="#000000" stroke-width="1" opacity="0.3"/>
