    <rect x="44" y="0" width="18" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="0" y="22" width="18" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="22" y="22" width="18" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="44" y="22" width="18" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="0" y="44" width="18" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="22" y="44" width="18" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="44" y="44" width="18" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
