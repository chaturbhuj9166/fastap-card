    <rect x="27" y="5" width="8" height="8" fill="#14b8a6"/>
    <polygon points="53,5 58,13 48,13" fill="#14b8a6"/>
    <path d="M 5 27 L 9 35 L 13 27" stroke="#14b8a6" stroke-width="2" fill="none"/>
    <circle cx="31" cy="31" r="5" stroke="#14b8a6" stroke-width="2" fill="none"/>
    <line x1="48" y1="27" x2="58" y2="37" stroke="#14b8a6" stroke-width="2"/>
