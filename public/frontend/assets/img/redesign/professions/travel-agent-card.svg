<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="400" height="300" fill="url(#travel-grad)"/>
  <defs>
    <linearGradient id="travel-grad" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- Decorative Elements -->
  <circle cx="350" cy="50" r="30" fill="white" opacity="0.1"/>
  <circle cx="50" cy="250" r="40" fill="white" opacity="0.1"/>

  <!-- Airplane Icon -->
  <g transform="translate(150, 80)">
    <path d="M50 30 L70 30 L90 50 L70 50 L60 60 L70 70 L50 70 L40 60 L30 70 L10 70 L20 60 L10 50 L30 50 Z" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="75" cy="35" r="3" fill="#4facfe"/>
  </g>

  <!-- Globe Icon -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="white" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="20" ry="35" fill="none" stroke="white" stroke-width="2"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="white" stroke-width="2"/>
    <line x1="0" y1="-35" x2="0" y2="35" stroke="white" stroke-width="2"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Travel &amp; Tours</text>
</svg>
