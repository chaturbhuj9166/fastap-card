<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="400" height="300" fill="url(#education-grad)"/>
  <defs>
    <linearGradient id="education-grad" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Decorative Elements -->
  <circle cx="350" cy="60" r="20" fill="white" opacity="0.1"/>
  <circle cx="60" cy="240" r="30" fill="white" opacity="0.1"/>

  <!-- Graduation Cap -->
  <g transform="translate(200, 110)">
    <polygon points="0,-30 -50,-15 -50,0 50,0 50,-15" fill="white"/>
    <rect x="-50" y="0" width="100" height="10" fill="white"/>
    <rect x="-5" y="10" width="10" height="40" fill="white"/>
    <polygon points="55,-10 65,-5 55,0" fill="white"/>
  </g>

  <!-- Book Icon -->
  <g transform="translate(200, 180)">
    <rect x="-30" y="-15" width="60" height="30" rx="2" fill="white" opacity="0.8"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#667eea" stroke-width="2"/>
    <line x1="-20" y1="-8" x2="20" y2="-8" stroke="#667eea" stroke-width="1.5"/>
    <line x1="-20" y1="8" x2="20" y2="8" stroke="#667eea" stroke-width="1.5"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Education</text>
</svg>
